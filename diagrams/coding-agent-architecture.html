<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코딩 에이전트 내부 구조 - Claude Code · Codex 공통 모델</title>
<meta name="description" content="코딩 에이전트의 내부 구조 다이어그램. 인터페이스, 하네스(컨텍스트 조립·에이전트 루프·도구·평가/제어·확장), 외부 실행 환경으로 나눈 구성도.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* 폰트: 다이어그램 본체가 Noto Sans CJK KR이라 페이지 크롬도 같은 계열로 맞춰
     이질감을 없앤다. 라벨은 자간이 고른 JetBrains Mono. */
  :root { --bg:#1b1b1f; --panel:#222227; --line:#3d3d46; --fg:#ececef; --dim:#a0a0aa; --accent:#5fb8a5; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
               font-family:'Noto Sans KR', system-ui, sans-serif; }
  .wrap { width:min(96vw,1680px); margin:0 auto; padding:28px 24px 56px; }
  @media (max-width:1120px){ .wrap{ width:100%; padding:20px 14px 40px; } }
  header { border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:20px; }
  .eyebrow { font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em;
             color:var(--accent); margin:0 0 8px; }
  h1 { font-size:24px; font-weight:700; margin:0 0 8px; line-height:1.3; }
  p.sub { margin:0; font-size:15px; color:var(--dim); line-height:1.6; }
  /* 좁은 화면에서는 가로 스크롤 + 핀치줌으로 원본 크기를 유지한다.
     축소해서 우겨넣으면 12~13px 라벨이 읽히지 않는다. */
  .figure { border:1px solid var(--line); background:var(--bg); overflow-x:auto; }
  .figure img { display:block; width:100%; min-width:1100px; height:auto; }
  .hint { margin:10px 0 0; font-size:13px; color:var(--dim); font-family:'JetBrains Mono', monospace; }
  .actions { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  .actions a { display:inline-block; font-size:14px; color:var(--fg); text-decoration:none;
               border:1px solid var(--line); padding:8px 14px; background:var(--panel); }
  .actions a:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:36px; padding-top:16px; border-top:1px solid var(--line);
           font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--dim); }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">DIAGRAM</p>
    <h1>코딩 에이전트 내부 구조 - Claude Code · Codex 공통 모델</h1>
    <p class="sub">인터페이스 → 하네스(컨텍스트 조립 · 에이전트 루프 · 도구 · 평가/제어 · 확장) → 외부 실행 환경.
      네 가지 인터페이스가 같은 코어로 수렴하고, 모델과 실행 환경은 하네스 경계 밖에 있다.</p>
  </header>

  <div class="figure">
    <img src="coding-agent-architecture.svg" alt="코딩 에이전트 내부 구조 다이어그램 - 상단 인터페이스 4종, 중앙 하네스 내부 구성요소와 에이전트 루프, 하단 외부 실행 환경 3종">
  </div>
  <p class="hint">좁은 화면에서는 좌우로 밀어서 보세요 · 확대는 핀치줌</p>

  <div class="actions">
    <a href="coding-agent-architecture.svg" target="_blank" rel="noopener">SVG 원본 열기</a>
    <a href="/">사이트 홈</a>
  </div>

  <footer>
    claude-code-expert.github.io/diagrams/ · <a href="https://run-ai.kr">run-ai.kr</a>
  </footer>
</div>
</body>
</html>
